<html><body style="margin:0;background:#111418">
<svg width="1024" height="1024" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0.55"/></filter></defs><rect width="24" height="24" fill="#111418"/><g id="halo" filter="url(#glow)" opacity=".7"></g><g id="ring"></g><circle cx="12" cy="12" r="1.9" fill="#e8ebef"/></svg>
<script>
const r = 6.6, n = 4, k = 3, gapDeg = 24, pt = a => [12 + r * Math.sin(a * Math.PI / 180), 12 - r * Math.cos(a * Math.PI / 180)]; let s = '';
for (let i = 0; i < n; i++) { const a0 = i * 360 / n + gapDeg / 2, a1 = (i + 1) * 360 / n - gapDeg / 2, [x0, y0] = pt(a0), [x1, y1] = pt(a1);
  s += `<path d="M${x0} ${y0}A${r} ${r} 0 0 1 ${x1} ${y1}" fill="none" stroke="${i < k ? '#b388ff' : '#2d343d'}" stroke-width="1.7" stroke-linecap="round"/>`; }
document.getElementById('ring').innerHTML = s;
document.getElementById('halo').innerHTML = s.replace(/<path[^>]*#2d343d[^>]*>/g, '');
</script></body></html>
