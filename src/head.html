<title>Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one 720px column, sticky header, fixed bottom tab bar within thumb reach.
   Committed dark theme (user request): graphite neutrals with a slight cool bias, one soft neon-purple accent,
   WHOOP-style status colours reserved for recovery state. */
:root {
  color-scheme: dark;
  --bg: #0a0c0f; --surface: #111418; --surface-2: #171b21; --surface-3: #1e232a;
  --line: #222830; --line-2: #2d343d;
  --ink: #e8ebef; --ink-2: #a5adb8; --ink-3: #6c7480;
  --accent: #b388ff; --accent-ink: #0a0c0f; --accent-soft: rgba(179, 136, 255, .13); --glow: rgba(179, 136, 255, .45);
  --good: #16ec06; --warn: #ffde00; --bad: #ff0026;
  --good-ink: #16ec06; --warn-ink: #ffde00; --bad-ink: #ff4d5e;
  --good-soft: rgba(22, 236, 6, .14); --warn-soft: rgba(255, 222, 0, .12); --bad-soft: rgba(255, 0, 38, .14);
  --logo: #b388ff;
  --strain: #0093e7; /* WHOOP strain blue. Recovery green, yellow and red above are WHOOP's #16EC06, #FFDE00, #FF0026 (bad-ink a touch lighter so red text stays readable on dark) */
  --s1: #a06bff; --s2: #d95926; --s3: #199e70; --s4: #6b7480;
  --z0: #4a525d; --z1: #b5aecb; --z2: #a06bff; --z3: #199e70; --z4: #e0a03a; --z5: #d95926;
  --f-body: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 12px; --tabh: 62px; --toph: 63px; --hdrdrop: 0px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 0 calc(var(--tabh) + 28px + env(safe-area-inset-bottom, 0px)); -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 720px; margin: 0 auto; padding-top: calc(env(safe-area-inset-top, 0px) + var(--toph) + var(--hdrdrop)); }
h1, h2, h3 { font-weight: 600; line-height: 1.15; margin: 0; letter-spacing: -.015em; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); } .dim { color: var(--ink-2); } .small { font-size: 13px; } .xs { font-size: 12px; }
.mono { font-family: var(--f-mono); }

/* header */
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; gap: 10px; height: calc(env(safe-area-inset-top, 0px) + var(--toph) + var(--hdrdrop)); padding: calc(env(safe-area-inset-top, 0px) + 12px + var(--hdrdrop)) max(16px, calc((100% - 720px) / 2)) 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; overflow: visible; } /* visible: the logo's glow mustn't be clipped square */
.mark-wrap { display: inline-grid; flex: none; } .mark { width: 24px; height: 24px; flex: none; filter: drop-shadow(0 0 2.5px var(--glow)); }
.sync { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
.sync.ok::before { background: var(--good); } .sync.bad::before { background: var(--bad); } .sync.busy::before { background: var(--warn); }
.iconbtn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink-2); }
.iconbtn svg { width: 18px; height: 18px; }
#reorder[hidden] { display: none; }
.iconbtn.txt { width: auto; padding: 0 12px; font-size: 14px; font-weight: 600; color: var(--accent); border-color: var(--accent); }
.reo { display: flex; flex-direction: column; gap: 8px; }
.reo-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.reo-item.sm { flex-direction: row; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); font-size: 14px; }
.reo-h { display: flex; align-items: center; gap: 10px; } .reo-h b { font-weight: 600; }
.reo-cols { display: flex; flex-direction: column; gap: 6px; }
.reo-item.dragging { border-color: var(--accent); box-shadow: 0 8px 24px rgba(0,0,0,.5); z-index: 2; position: relative; }
.iconbtn[aria-current="page"] { border-color: var(--accent); color: var(--accent); }

#view { display: flex; flex-direction: column; gap: 14px; padding-top: 18px; }
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-h h1 { font-size: 26px; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 6px; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; container-type: inline-size; }
.card.flat { background: transparent; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-h h2 { font-size: 17px; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }
/* Recovery card: ring + key rows, then equal tiles. Every cell is label, value, one sub line, so rows line up. */
.rcard { gap: 14px; }
.rtop { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.rkeys { display: flex; flex-direction: column; min-width: 0; }
.rk { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: 'l v' 's v'; column-gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); min-width: 0; }
.rk:first-child { border-top: 0; padding-top: 0; } .rk:last-child { padding-bottom: 0; }
.rk > span { grid-area: l; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rk > b { grid-area: v; font-size: 22px; }
.rk > em { grid-area: s; }
.rtiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rt { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); min-width: 0; }
.rt > span { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rt > b { font-size: 20px; }
.rk > b, .rt > b { font-weight: 600; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rk > b small, .rt > b small { font-size: 12px; font-weight: 500; color: var(--ink-3); margin-left: 3px; letter-spacing: 0; }
.rk > b.nil, .rt > b.nil { color: var(--ink-3); }
.rt > b.strain { color: var(--strain); }
.rk > em, .rt > em { font-style: normal; font-size: 11.5px; color: var(--ink-3); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rcard em.tn-good { color: var(--good-ink); } .rcard em.tn-warn { color: var(--warn-ink); }
.rsrc { font-family: var(--f-mono); font-size: 11px; letter-spacing: .04em; color: var(--ink-3); }
@container (max-width: 340px) { .rtiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .rtop { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 14px; } .rkeys { width: 100%; } }
@container (min-width: 600px) { /* wide screens: ring, then the three key numbers side by side; tiles in one row */
  .rtop { gap: 28px; }
  .rkeys { flex-direction: row; }
  .rk { flex: 1; grid-template-columns: minmax(0, 1fr); grid-template-areas: 'l' 'v' 's'; row-gap: 4px; padding: 2px 0 2px 20px; border-top: 0; border-left: 1px solid var(--line); }
  .rk:first-child { border-left: 0; padding-left: 0; } .rk > b { font-size: 28px; }
  .rtiles { gap: 10px; } .rt { padding: 12px 14px; } .rt > b { font-size: 22px; }
}
.ring { width: 112px; height: 112px; position: relative; display: grid; place-items: center; flex: none; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring b { font-size: 26px; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ring b small { font-size: 14px; color: var(--ink-3); font-weight: 500; }
#liftchart { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + var(--toph) + 12px); }
.tbl.lifts tbody tr { cursor: pointer; }
.tbl.goal td.act, .tbl.goal th.act { color: var(--accent); font-weight: 600; }
button.pill { border: 0; font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; }
.tbl.lifts tr.sel td { background: var(--accent-soft); }
.tbl.lifts tr.sel td:first-child { box-shadow: inset 2px 0 0 var(--accent); padding-left: 8px; }
.updp { position: fixed; left: 12px; right: 12px; max-width: 696px; margin: 0 auto; bottom: calc(var(--tabh) + max(8px, calc(env(safe-area-inset-bottom, 0px) - 8px)) + 10px); z-index: 45;
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface-3); border: 1px solid var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.updp > div { flex: 1; min-width: 0; display: flex; flex-direction: column; } .updp b { font-size: 14.5px; } .updp span { font-size: 12.5px; color: var(--ink-2); }
.hr { height: 1px; background: var(--line); border: 0; margin: 0; }

/* hero: next session */
.hero { padding: 20px 18px; gap: 14px; background: linear-gradient(180deg, var(--surface-2), var(--surface)); }
.hero h1 { font-size: 38px; letter-spacing: -.03em; line-height: 1; }
.hero .focus { color: var(--ink-2); font-size: 15px; }
.rot { display: flex; gap: 4px; }
.rot i { flex: 1; height: 4px; border-radius: 2px; background: var(--line-2); }
.rot i.on { background: var(--accent); box-shadow: 0 0 6px var(--glow); } .rot i.done { background: var(--ink-3); }
.exlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.exlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14.5px; align-items: baseline; }
.exlist li .rx { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.exlist li .lt { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-3); margin-top: -2px; }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(64px, 1fr); gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.sd { border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px; display: flex; flex-direction: column; gap: 1px; background: var(--surface); min-width: 0; }
.sd small { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
.sd b { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sd.now { border-color: var(--accent); background: var(--accent-soft); }
.sd.now.done { opacity: 1; } .sd.now.done b::after { content: ' ✓'; color: var(--good-ink); font-weight: 600; } /* today stays highlighted once logged */
.chips.one { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } .chips.one::-webkit-scrollbar { display: none; }
.chips.one { gap: 6px; justify-content: space-between; } /* WHOOP left, Apple Health right, MacroFactor the same distance from each */ .chips.one .pill { font-size: 12px; padding: 3px 8px; flex: none; }
.sd.done { opacity: .6; }
.sd.rest b { color: var(--ink-3); font-weight: 500; }
button.sd { font: inherit; color: inherit; text-align: left; cursor: pointer; }
.sd.planned { border-style: dashed; }
.sd.pick { border-color: var(--accent); background: var(--accent-soft); } /* the picked day takes today's highlight */
.pickrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 13.5px; }
.pickrow .btn { flex: none; }
.restchip { display: inline-flex; align-items: center; gap: 6px; padding-right: 3px; }
.ed-x.sm { width: 24px; height: 24px; border: 0; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stats.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat b small { font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 2px; letter-spacing: 0; }
.stat > span { font-size: 12px; color: var(--ink-3); }
.delta { font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); line-height: 1.35; margin-top: 2px; }
.stat > span { overflow-wrap: anywhere; }
@container (min-width: 520px) { .stats.four { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@container (max-width: 400px) { .stat b { font-size: 21px; } .stats { column-gap: 10px; } }
@container (max-width: 300px) { .stat b { font-size: 19px; } .stat b small { font-size: 11px; margin-left: 1px; } }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; padding: 3px 10px; border-radius: 99px; white-space: nowrap; background: var(--surface-3); color: var(--ink-2); }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--good-soft); color: var(--good-ink); } .pill.warn { background: var(--warn-soft); color: var(--warn-ink); } .pill.bad { background: var(--bad-soft); color: var(--bad-ink); }
.pill.plain::before { display: none; }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.note { font-size: 13.5px; color: var(--ink-2); padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }

/* buttons */
.btn { min-height: 46px; padding: 10px 18px; border-radius: 11px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn.acc { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 13.5px; border-radius: 9px; }
.btn.wide { width: 100%; min-height: 52px; font-size: 16px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .4; cursor: default; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.link { background: none; border: 0; padding: 6px 0; color: var(--accent); font-weight: 500; font-size: 14px; min-height: 36px; }
.link.danger { color: var(--bad-ink); } .link.dim { color: var(--ink-3); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 36px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line-2); background: transparent; font-size: 13.5px; font-weight: 500; color: var(--ink-2); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; min-height: 30px; padding: 4px 10px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: var(--ink-3); font-family: var(--f-mono); }
.seg button.on { background: var(--surface-3); color: var(--ink); }

/* inputs */
.in { width: 100%; min-height: 46px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--bg); color: var(--ink); font-size: 18px; font-weight: 500; text-align: center; padding: 4px 6px; font-variant-numeric: tabular-nums; }
.in::placeholder { color: var(--ink-3); opacity: .7; }
.in.left { text-align: left; font-size: 15px; padding-inline: 12px; }
select.in { appearance: none; -webkit-appearance: none; text-align: left; font-size: 15px; padding-inline: 12px; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
textarea.in { text-align: left; font-size: 15px; min-height: 76px; padding: 10px 12px; resize: vertical; font-weight: 400; }
.fl { font-size: 12.5px; color: var(--ink-3); display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.fields .full { grid-column: 1 / -1; }

/* logging */
.dnav { display: flex; align-items: center; gap: 8px; }
.dnav-c { flex: 1; text-align: center; display: flex; flex-direction: column; }
.dnav-c b { font-weight: 600; font-size: 16px; }
.dnav-c small { color: var(--ink-3); font-size: 12px; }
.sess-top { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--toph) + var(--hdrdrop)); z-index: 15; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line-2); }
.sess-top .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.sess-top .t b { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sess-top .t small { font-size: 12px; color: var(--ink-3); }
.ex { gap: 10px; }
.ex-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ex-h h3 { font-size: 17px; min-width: 0; }
.ex-h .rx { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.ex-name { display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; text-align: left; min-width: 0; color: inherit; }
.ex-name .chev { color: var(--ink-3); } .ex-name[aria-expanded="true"] .chev { transform: rotate(180deg); }
.exhist { background: var(--surface-2); border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; }
.exhist ul { list-style: none; margin: 0; padding: 0; }
.exhist li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; padding: 5px 0; font-size: 13.5px; border-top: 1px solid var(--line); align-items: baseline; }
.exhist li:first-child { border-top: 0; }
.exhist li small { display: block; color: var(--ink-3); font-size: 12px; }
.exhist .link { align-self: flex-start; min-height: 30px; font-size: 13px; }
.ex-meta { font-size: 12.5px; color: var(--ink-3); margin-top: -6px; }
.aim { font-size: 13px; color: var(--ink-2); margin-top: -6px; }
.warnnote { background: var(--warn-soft); color: var(--warn-ink); border-radius: 10px; padding: 10px 12px; margin: 0; }
.aim b, .aimtxt { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.sets { display: flex; flex-direction: column; gap: 6px; }
.set { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr) 22px; gap: 8px; align-items: center; }
.set.hdr { font-family: var(--f-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.set.hdr span { text-align: center; } .set.hdr span:first-child { text-align: left; }
.sn { font-family: var(--f-mono); font-size: 13px; color: var(--ink-3); }
.mark { display: grid; place-items: center; color: transparent; }
.mark svg { width: 18px; height: 18px; }
.set .in::placeholder { color: var(--ink-3); opacity: .55; }
.set.done .in { border-color: var(--line-2); background: var(--surface-2); }
.set.done .mark { color: var(--good-ink); }
.set.pr .mark { color: var(--accent); }
.set.pr .in { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.ex-foot { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.ex-foot .more { margin-left: auto; }
.ex-more { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.ex-nav .rng { white-space: nowrap; flex: 1; text-align: center; }
.whoopact { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: 9px; padding: 8px 10px; }

/* lists */
