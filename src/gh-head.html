<!doctype html>
<html lang="en" class="shell">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit">
<meta name="theme-color" content="#0a0c0f">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
/* App shell for the home-screen app: the page is pinned and can't move, so iOS has nothing to shift or inset.
   Only #scroll scrolls; the header and tab bar sit outside it. */
html.shell, html.shell body { height: 100%; overflow: hidden; overscroll-behavior: none; }
html.shell body { position: fixed; inset: 0; padding: 0; }
html.shell #scroll { position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
  padding: 0 16px calc(var(--tabh) + 28px + env(safe-area-inset-bottom, 0px)); }
</style>
