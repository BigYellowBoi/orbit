<!doctype html>
<html lang="en" class="shell">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit">
<meta name="theme-color" content="#0a0c0f">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
/* App shell for the home-screen app: the page is pinned and can't move, so iOS has nothing to shift or inset.
   Only #scroll scrolls; the header and tab bar sit outside it.
   WebKit bug 254868: in home-screen apps with viewport-fit=cover, 100%, svh and visualViewport come out short by the
   status bar and home indicator, and absolutely positioned bottom elements float above the real edge. vh includes
   those insets and position: fixed anchors to the real bottom, which is the workaround given in the bug report. */
html.shell, html.shell body { height: 100vh; min-height: 100vh; overflow: hidden; overscroll-behavior: none; }
html.shell body { position: fixed; top: 0; left: 0; right: 0; padding: 0; }
html.shell #scroll { position: absolute; top: 0; left: 0; right: 0; height: 100vh; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
  padding: 0 16px calc(var(--tabh) + 28px + env(safe-area-inset-bottom, 0px)); }
</style>
