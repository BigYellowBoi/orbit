<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit">
<meta name="theme-color" content="#0a0c0f">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script>try { localStorage.removeItem('orbit-layout'); localStorage.removeItem('orbit-hdr'); } catch (e) { } /* retired layout experiments */</script>
<script>/* Scroll box layout (test, switched on the Data screen): only #scroll scrolls; see boot.js */
try { if (localStorage.getItem('orbit-scrollbox') === '1') document.documentElement.classList.add('sbox'); } catch (e) { }</script>
<style>
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; } /* vh includes the safe areas in home-screen apps (WebKit bug 254868) */
/* iOS draws a blurred band over the top of home-screen apps, reaching about 14pt below the status bar. Tested on an
   iPhone 13 Pro Max (v1.3 Display check): the header row is sharp only when moved below it. */
@media (display-mode: standalone) { html:root { --hdrdrop: 14px; } }
/* Scroll box: the content scrolls inside a fixed box anchored to all four edges. No vh or 100% heights: the earlier
   pinned shell sized itself with those and came out short on the 13 Pro Max (WebKit bug 254868), while position: fixed
   with top and bottom anchors to the real screen edges, as the tab bar does. body keeps its min-height: 100vh: without it
   iOS leaves the viewport a status bar short and fixed elements stop ~47pt above the bottom (v1.9 on the 13 Pro Max). */
html.sbox #scroll { position: fixed; top: 0; right: 0; bottom: 0; left: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior-y: contain;
  padding: 0 16px calc(var(--tabh) + 28px + env(safe-area-inset-bottom, 0px)); }
</style>
