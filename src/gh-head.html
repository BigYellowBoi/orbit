<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit">
<meta name="theme-color" content="#0a0c0f">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script>/* layout: 'standard' (page scrolls, the default) or 'pinned' (html.shell). Switch on the Data screen. */
try { if (localStorage.getItem('orbit-layout') === 'pinned') document.documentElement.classList.add('shell'); const hd = localStorage.getItem('orbit-hdr'); if (hd === 't1' || hd === 't2') document.documentElement.classList.add('hdr-' + hd); } catch (e) { }</script>
<style>
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
html:not(.shell) body { min-height: 100vh; } /* vh includes the safe areas in home-screen apps (WebKit bug 254868) */
/* iOS draws a blurred band over the top of home-screen apps, reaching about 14pt below the status bar. Tested on an
   iPhone 13 Pro Max (v1.3 Display check): the header row is sharp only when moved below it. */
@media (display-mode: standalone) { html:root { --hdrdrop: 14px; } }
/* Experiment (Display check → Header): header back up, with a background a shade off the page, to see whether iOS then
   treats it as a solid bar and stops blurring it. */
html.hdr-t1:root, html.hdr-t2:root { --hdrdrop: 0px; }
html.hdr-t1 .top { background: #111418; } html.hdr-t2 .top { background: #171b21; }
/* Pinned layout (opt-in on the Data screen while it's tested on iOS). App shell: the page is pinned and can't move, so iOS has nothing to shift or inset.
   Only #scroll scrolls; the header and tab bar sit outside it.
   WebKit bug 254868: in home-screen apps with viewport-fit=cover, 100%, svh and visualViewport come out short by the
   status bar and home indicator, and absolutely positioned bottom elements float above the real edge. vh includes
   those insets and position: fixed anchors to the real bottom, which is the workaround given in the bug report. */
html.shell, html.shell body { height: 100vh; min-height: 100vh; overflow: hidden; overscroll-behavior: none; }
html.shell body { position: fixed; top: 0; left: 0; right: 0; padding: 0; }
html.shell #scroll { position: absolute; top: 0; left: 0; right: 0; height: 100vh; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
  padding: 0 16px calc(var(--tabh) + 28px + env(safe-area-inset-bottom, 0px)); }
</style>
