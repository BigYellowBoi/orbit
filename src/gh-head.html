<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit">
<meta name="theme-color" content="#0a0c0f">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script>try { localStorage.removeItem('orbit-layout'); localStorage.removeItem('orbit-hdr'); } catch (e) { } /* retired layout experiments */</script>
<style>
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; } /* vh includes the safe areas in home-screen apps (WebKit bug 254868) */
/* iOS draws a blurred band over the top of home-screen apps, reaching about 14pt below the status bar. Tested on an
   iPhone 13 Pro Max (v1.3 Display check): the header row is sharp only when moved below it. */
@media (display-mode: standalone) { html:root { --hdrdrop: 14px; } }
</style>
