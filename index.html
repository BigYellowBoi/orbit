<script>/* No zooming (Louis's call, v1.16): maximum-scale stops iOS zooming in on a focused input, the gesture events stop
   pinch zoom (iOS ignores user-scalable=no on its own), and touch-action: manipulation below stops double-tap zoom. */
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));</script>

<style>
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
body { min-height: 100vh; } /* vh includes the safe areas in home-screen apps (WebKit bug 254868) */
/* iOS draws a blurred band over the top of home-screen apps, reaching about 14pt below the status bar. Tested on an
   iPhone 13 Pro Max (v1.3 Display check): the header row is sharp only when moved below it. */
@media (display-mode: standalone) { html:root { --hdrdrop: 14px; } }
/* Scroll box (html.sbox, always on in the home-screen app since v1.12): the content scrolls inside a fixed box anchored to all four edges. No vh or 100% heights: the earlier
   pinned shell sized itself with those and came out short on the 13 Pro Max (WebKit bug 254868), while position: fixed
   with top and bottom anchors to the real screen edges, as the tab bar does. body keeps its min-height: 100vh: without it
   iOS leaves the viewport a status bar short and fixed elements stop ~47pt above the bottom (v1.9 on the 13 Pro Max). */
/* A short page (History with few sessions) left #scroll with nothing to scroll, so a swipe fell through to the page itself,
   iOS rubber-banded the page, and taps on the tab bar were swallowed until the bounce settled (~0.5-1 s, v1.10). Now the box
   always has 1px to scroll, so it takes every swipe and bounces inside itself, and the page can't bounce at all. */
html.sbox, html.sbox body { overscroll-behavior: none; }
html.sbox .wrap { min-height: calc(100% + 1px); box-sizing: border-box; }
html.sbox #scroll { position: fixed; top: 0; right: 0; bottom: 0; left: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior-y: contain;
  padding: 0 16px calc(var(--tabh) + 28px + env(safe-area-inset-bottom, 0px)); }
</style>

<style>
/* Layout: one 720px column, sticky header, fixed bottom tab bar within thumb reach.
   Committed dark theme (user request): graphite neutrals with a slight cool bias, one soft neon-purple accent,
   WHOOP-style status colours reserved for recovery state. */
:root {
  color-scheme: dark;
  --bg: #0a0c0f; --surface: #111418; --surface-2: #171b21; --surface-3: #1e232a;
  --line: #222830; --line-2: #2d343d;
  --ink: #e8ebef; --ink-2: #a5adb8; --ink-3: #80889a; /* v1.36: was #6c7480 (3.9:1 on cards); now 5.2:1 on cards, 4.9:1 on tiles, past WCAG AA */
  --accent: #b388ff; --accent-ink: #0a0c0f; --accent-soft: rgba(179, 136, 255, .13); --glow: rgba(179, 136, 255, .45);
  --good: #16ec06; --warn: #ffde00; --bad: #ff0026;
  --good-ink: #16ec06; --warn-ink: #ffde00; --bad-ink: #ff4d5e;
  --good-soft: rgba(22, 236, 6, .14); --warn-soft: rgba(255, 222, 0, .12); --bad-soft: rgba(255, 0, 38, .14);
  --logo: #b388ff;
  --inj: #ff6fa3; --inj-ink: #ff8db6; --inj-soft: rgba(255, 111, 163, .11); /* v1.63: injuries, a soft rose that sits with the purple accent (was the warning yellow) */
  --strain: #0093e7; /* WHOOP strain blue. Recovery green, yellow and red above are WHOOP's #16EC06, #FFDE00, #FF0026 (bad-ink a touch lighter so red text stays readable on dark) */
  --s1: #a06bff; --s2: #d95926; --s3: #199e70; --s4: #6b7480;
  --z0: #4a525d; --z1: #b5aecb; --z2: #a06bff; --z3: #199e70; --z4: #e0a03a; --z5: #d95926;
  --f-body: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 12px; --tabh: 62px; --toph: 63px; --hdrdrop: 0px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 0 calc(var(--tabh) + 28px + env(safe-area-inset-bottom, 0px)); -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
.wrap { max-width: var(--maxw, 720px); margin: 0 auto; padding-top: calc(env(safe-area-inset-top, 0px) + var(--toph) + var(--hdrdrop)); }
h1, h2, h3 { font-weight: 600; line-height: 1.15; margin: 0; letter-spacing: -.015em; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); } .dim { color: var(--ink-2); } .small { font-size: 13px; } .xs { font-size: 12px; }
.mono { font-family: var(--f-mono); }

/* header */
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; gap: 10px; height: calc(env(safe-area-inset-top, 0px) + var(--toph) + var(--hdrdrop)); padding: calc(env(safe-area-inset-top, 0px) + 12px + var(--hdrdrop)) max(16px, calc((100% - var(--maxw, 720px)) / 2)) 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; overflow: visible; } /* visible: the logo's glow mustn't be clipped square */
.mark-wrap { display: inline-grid; flex: none; } .mark { width: 24px; height: 24px; flex: none; filter: drop-shadow(0 0 2.5px var(--glow)); }
.sync { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
.sync.ok::before { background: var(--good); } .sync.bad::before { background: var(--bad); } .sync.busy::before { background: var(--warn); }
.iconbtn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink-2); }
.iconbtn svg { width: 18px; height: 18px; }
#reorder[hidden] { display: none; }
.iconbtn.txt { width: auto; padding: 0 12px; font-size: 14px; font-weight: 600; color: var(--accent); border-color: var(--accent); }
.reo { display: flex; flex-direction: column; gap: 8px; }
.reo-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.reo-item.sm { flex-direction: row; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); font-size: 14px; }
.reo-h { display: flex; align-items: center; gap: 10px; } .reo-h b { font-weight: 600; }
.reo-cols { display: flex; flex-direction: column; gap: 6px; }
.reo-item.dragging { border-color: var(--accent); box-shadow: 0 8px 24px rgba(0,0,0,.5); z-index: 2; position: relative; }
.iconbtn[aria-current="page"] { border-color: var(--accent); color: var(--accent); }

#view { display: flex; flex-direction: column; gap: 14px; padding-top: 18px; }
/* Desktop (v1.36): from 1100px the column widens and card screens (Today, Strength, Body, Settings) go two across; logs, History and Plan stay one column */
@media (min-width: 1100px) {
  :root { --maxw: 1120px; }
  #view:not(.cols) { max-width: 720px; margin-inline: auto; width: 100%; }
  #view.cols { display: block; columns: 2; column-gap: 16px; } /* balanced columns, so a long card doesn't leave a hole beside it (a grid did) */
  #view.cols > * { break-inside: avoid; margin-bottom: 16px; width: 100%; }
  #view.cols > :is(.page-h, .chips, .seg, p, .btnrow, .srch) { column-span: all; }
}
/* set fields stay a sensible width on wide screens */
@media (min-width: 700px) { .set { grid-template-columns: 26px minmax(0, 170px) minmax(0, 170px) 22px; justify-content: start; } .set .lastset { text-align: center; } }
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-h h1 { font-size: 26px; }
/* Today and the days around it: one row that never wraps, and the arrows sit at the same spot on every day (v1.36) */
.page-h.day { flex-wrap: nowrap; align-items: flex-end; } .page-h.day > div:first-child { min-width: 0; } .page-h.day h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page-h.day .hdr-r, .page-h.day > .daynav { height: 34px; align-items: center; flex: none; }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 6px; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; container-type: inline-size; }
.card.flat { background: transparent; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-h h2 { font-size: 17px; flex: none; } .card-h > .eyebrow { text-align: right; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }
/* Recovery card: ring + key rows, then equal tiles. Every cell is label, value, one sub line, so rows line up. */
.rcard { gap: 14px; }
.rtop { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.rkeys { display: flex; flex-direction: column; min-width: 0; }
.rk { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: 'l v' 's v'; column-gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); min-width: 0; }
.rk:first-child { border-top: 0; padding-top: 0; } .rk:last-child { padding-bottom: 0; }
.rk > span { grid-area: l; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rk > b { grid-area: v; font-size: 22px; }
.rk > em { grid-area: s; }
.rtiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rt { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); min-width: 0; }
.rt > span { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rt > b { font-size: 20px; }
.rk > b, .rt > b { font-weight: 600; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rk > b small, .rt > b small { font-size: 12px; font-weight: 500; color: var(--ink-3); margin-left: 3px; letter-spacing: 0; }
.rk > b.nil, .rt > b.nil { color: var(--ink-3); }
.rt > b.strain { color: var(--strain); }
.rk > em, .rt > em { font-style: normal; font-size: 11.5px; color: var(--ink-3); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rcard em.tn-good { color: var(--good-ink); } .rcard em.tn-warn { color: var(--warn-ink); } .tn-inj { color: var(--inj-ink); }
.rsrc { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .04em; color: var(--ink-3); }
.rtiles.e4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } @container (min-width: 600px) { .rtiles.e4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
/* Weekly summary: the week column stays put while the rest scrolls, and the edge fades when there's more (v1.36) */
.tbl.wk th:first-child, .tbl.wk td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; box-shadow: 1px 0 0 var(--line); padding-left: 2px; }
.tblwrap.fade { -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
.tblwrap.fade.end { -webkit-mask-image: none; mask-image: none; }
@container (max-width: 340px) { .rtiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .rtop { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 14px; } .rkeys { width: 100%; } }
@container (min-width: 600px) { /* wide screens: ring, then the three key numbers side by side; tiles in one row */
  .rtop { gap: 28px; }
  .rkeys { flex-direction: row; }
  .rk { flex: 1; grid-template-columns: minmax(0, 1fr); grid-template-areas: 'l' 'v' 's'; row-gap: 4px; padding: 2px 0 2px 20px; border-top: 0; border-left: 1px solid var(--line); }
  .rk:first-child { border-left: 0; padding-left: 0; } .rk > b { font-size: 28px; }
  .rtiles { gap: 10px; } .rt { padding: 12px 14px; } .rt > b { font-size: 22px; }
}
.ring { width: 112px; height: 112px; position: relative; display: grid; place-items: center; flex: none; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring b { font-size: 26px; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ring b small { font-size: 14px; color: var(--ink-3); font-weight: 500; }
#liftchart { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + var(--toph) + 12px); }
.tbl.lifts tbody tr { cursor: pointer; }
.tbl.goal td.act, .tbl.goal th.act { color: var(--accent); font-weight: 600; }
button.pill { border: 0; font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; }
.tbl.lifts tr.sel td { background: var(--accent-soft); }
.tbl.lifts tr.sel td:first-child { box-shadow: inset 2px 0 0 var(--accent); padding-left: 8px; }
.updp { position: fixed; left: 12px; right: 12px; max-width: 696px; margin: 0 auto; bottom: calc(var(--tabh) + max(8px, calc(env(safe-area-inset-bottom, 0px) - 8px)) + 10px); z-index: 45;
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface-3); border: 1px solid var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.updp > div { flex: 1; min-width: 0; display: flex; flex-direction: column; } .updp b { font-size: 14.5px; } .updp span { font-size: 12.5px; color: var(--ink-2); }
.hr { height: 1px; background: var(--line); border: 0; margin: 0; }

/* hero: next session */
.hero { padding: 20px 18px; gap: 14px; background: linear-gradient(180deg, var(--surface-2), var(--surface)); }
.hero h1 { font-size: 38px; letter-spacing: -.03em; line-height: 1; }
.hero .focus { color: var(--ink-2); font-size: 15px; }
.rot { display: flex; gap: 4px; }
.rot i { flex: 1; height: 4px; border-radius: 2px; background: var(--line-2); }
.rot i.on { background: var(--accent); box-shadow: 0 0 6px var(--glow); } .rot i.done { background: var(--ink-3); }
.exlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.exlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14.5px; align-items: baseline; }
.exlist li .rx { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.exlist li .lt { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-3); margin-top: -2px; }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(64px, 1fr); gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.sd { border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px; display: flex; flex-direction: column; gap: 1px; background: var(--surface); min-width: 0; }
.sd small { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
.sd b { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sd.now { border-color: var(--accent); background: var(--accent-soft); }
.sd { position: relative; } .sd.now.done { opacity: 1; } .sd.now.done::after { content: '✓'; position: absolute; top: 6px; right: 8px; font-size: 12px; line-height: 1; color: var(--good-ink); font-weight: 700; } /* today stays highlighted once logged; the tick is a corner badge so the name never clips (v1.36) */
.chips.one { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } .chips.one::-webkit-scrollbar { display: none; }
.chips.one { gap: 6px; justify-content: flex-start; } /* grouped on the left (v1.34) */ .chips.one .pill { font-size: 12px; padding: 3px 8px; flex: none; }
.sd.done { opacity: .6; }
.sd.rest b { color: var(--ink-3); font-weight: 500; }
button.sd { font: inherit; color: inherit; text-align: left; cursor: pointer; }
.sd.planned { border-style: dashed; }
.sd.pick { border-color: var(--accent); background: var(--accent-soft); } /* the picked day takes today's highlight */
.pickrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 13.5px; }
.pickrow .btn { flex: none; }
.restchip { display: inline-flex; align-items: center; gap: 6px; padding-right: 3px; }
.ed-x.sm { width: 24px; height: 24px; border: 0; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stats.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat b small { font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 2px; letter-spacing: 0; }
.stat > span { font-size: 12px; color: var(--ink-3); }
.stat .sstr, .stat .stime { font-style: normal; font-size: 12px; line-height: 1.3; font-variant-numeric: tabular-nums; white-space: nowrap; } /* v1.46: strain above, start and end below the time */
.stat .sstr { color: var(--strain); } .stat .stime { color: var(--ink-2); margin-top: 1px; }
.exlist.ro li .rx { display: grid; grid-template-columns: auto auto; column-gap: 12px; row-gap: 3px; justify-content: end; text-align: right; } /* v1.47: sets stacked, tag then load × reps */
.exlist.ro .rs { display: contents; } .exlist.ro .rs i { font-style: normal; color: var(--ink-3); } .exlist.ro .rw { color: var(--ink-3); } .exlist.ro .rpr { color: var(--accent); }
.delta { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); line-height: 1.35; margin-top: 2px; }
.stat > span { overflow-wrap: anywhere; }
@container (min-width: 520px) { .stats.four { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@container (max-width: 400px) { .stat b { font-size: 21px; } .stats { column-gap: 10px; } }
@container (max-width: 300px) { .stat b { font-size: 19px; } .stat b small { font-size: 11.5px; margin-left: 1px; } }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; padding: 3px 10px; border-radius: 99px; white-space: nowrap; background: var(--surface-3); color: var(--ink-2); }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--good-soft); color: var(--good-ink); } .pill.warn { background: var(--warn-soft); color: var(--warn-ink); } .pill.bad { background: var(--bad-soft); color: var(--bad-ink); }
.pill.plain::before { display: none; }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.note { font-size: 13.5px; color: var(--ink-2); padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }

/* buttons */
.btn { min-height: 46px; padding: 10px 18px; border-radius: 11px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn.acc { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 13.5px; border-radius: 9px; }
.btn.wide { width: 100%; min-height: 52px; font-size: 16px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }

    return ch;
  },
  markAllLocal() {
    this.meta.dirty[this.path('settings')] = true;
    for (const kind of ['wk', 'dy']) for (const k in STATE[KIND[kind]]) this.mark(kind, k);
  },
  markLocalOnly(remote) {
    if (!remote[this.path('settings')]) this.meta.dirty[this.path('settings')] = true;
    for (const kind of ['wk', 'dy']) { const months = new Set(Object.keys(STATE[KIND[kind]]).map(k => k.slice(0, 7))); for (const ym of months) if (!remote[this.path(kind, ym)]) this.mark(kind, ym); }
  },

  /* ---------- push ---------- */
  async push() {
    const m = this.meta, paths = Object.keys(m.dirty); if (!paths.length) return true;
    const taking = m.dirty; m.dirty = {};
    try {
      const entries = [], newKnown = { ...m.known };
      for (const p of paths) {
        const text = this.content(p);
        if (text == null) { if (m.known[p]) { entries.push({ path: p, mode: '100644', type: 'blob', sha: null }); delete newKnown[p]; } continue; }
        const sha = await this.gitSha(text); if (sha === m.known[p]) continue;
        entries.push({ path: p, mode: '100644', type: 'blob', content: text }); newKnown[p] = sha;
      }
      if (!entries.length) { this.saveMeta(); return true; }
      if (!m.head) { // the Git Data API refuses empty repos, so seed the first commit through the contents API
        const first = entries.find(e => e.content) || { path: 'orbit/settings.json', content: JSON.stringify(STATE.settings) };
        const r = await this.req('PUT', this.repoUrl(`/contents/${first.path}`), { message: 'Orbit: start sync', content: b64(first.content), branch: this.branch() });
        m.head = r.commit.sha; m.tree = r.commit.tree.sha; m.known = { [first.path]: r.content.sha };
        this.restore(taking); this.saveMeta(); return false; // the rest goes as one commit next round
      }
      const tree = await this.req('POST', this.repoUrl('/git/trees'), { base_tree: m.tree, tree: entries });
      const commit = await this.req('POST', this.repoUrl('/git/commits'), { message: `Orbit: ${entries.length} file${entries.length === 1 ? '' : 's'} from ${this.device()}`, tree: tree.sha, parents: [m.head] });
      await this.req('PATCH', this.repoUrl(`/git/refs/heads/${this.branch()}`), { sha: commit.sha, force: false });
      m.head = commit.sha; m.tree = tree.sha; m.known = newKnown; this.saveMeta(); return true;
    } catch (e) {
      this.restore(taking); this.saveMeta();
      if (e.status === 422 || e.status === 409) return false; // another device got there first
      throw e;
    }
  },
  restore(taking) { const d = this.meta.dirty; for (const p in taking) { const cur = d[p], t = taking[p]; d[p] = cur === undefined ? t : (cur === '*' || t === '*') ? '*' : (cur === true || t === true) ? true : [...new Set([...t, ...cur])]; } },
  device() { return /iPhone|iPad|Android/i.test(navigator.userAgent) ? 'phone' : 'browser'; },

  /* ---------- loop ---------- */
  async sync() {
    if (!this.on()) return;
    if (this.busy) { this.again = true; return; }
    if (navigator.onLine === false) { this.setState('offline'); return; }
    this.busy = true; clearTimeout(this.timer); this.setState('syncing');
    try {
      for (let tries = 0; tries < 4; tries++) { await this.pull(); if (await this.push()) break; }
      this.meta.at = Date.now(); this.err = null; this.saveMeta();
      this.setState(Object.keys(this.meta.dirty).length ? 'syncing' : 'ok');
    } catch (e) {
      console.warn('GitHub sync', e.status || '', e.message);
      if (!e.status) this.setState('offline');
      else { this.err = e.status === 401 ? 'GitHub rejected the token. It may have expired: make a new one and reconnect.' : e.status === 404 ? 'Repo not found, or the token can’t see it.' : e.ratelimit ? 'GitHub rate limit reached. Sync resumes shortly.' : e.status === 403 ? 'The token can’t write to this repo. Give it Contents: read and write.' : 'GitHub said: ' + e.message; this.setState('error'); }
    } finally {
      this.busy = false; this.saveMeta();

    }
  },
  setState(s) { this.state = s; const el = $('#ghstat'); if (el) el.innerHTML = this.pill(); const at = $('#ghat'); if (at) at.textContent = this.atText(); const er = $('#gherr'); if (er) { er.textContent = this.state === 'error' ? this.err || '' : ''; er.hidden = this.state !== 'error'; } },
  pill() { return ({ ok: pill('good', 'Synced'), syncing: pill('', 'Syncing'), offline: pill('warn', 'Offline'), error: pill('bad', 'Not synced'), off: pill('', 'This browser') })[this.on() ? this.state : 'off']; },
  atText() { const a = this.meta?.at; if (!a) return 'Not synced yet'; const s = (Date.now() - a) / 1000; return 'Last synced ' + (s < 60 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : new Date(a).toLocaleString('en-AU', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })); },

  async connect(owner, repo, token) {
    this.cfg = { owner, repo, token, branch: 'main' };
    let r;
    try { r = await this.req('GET', this.repoUrl('')); }
    catch (e) { this.cfg = null; throw new Error(e.status === 401 ? 'GitHub rejected that token.' : e.status === 404 ? `Can’t find ${owner}/${repo} with that token.` : 'Couldn’t reach GitHub. Check your connection.'); }

    if (r.permissions && !r.permissions.push) { this.cfg = null; throw new Error('That token can read the repo but not write to it. Give it Contents: read and write.'); }
    this.cfg.branch = r.default_branch || 'main';
    try { localStorage.setItem(GH_CFG, JSON.stringify(this.cfg)); } catch (e) { }

  },
  disconnect() { this.stop(); this.cfg = null; this.meta = this.freshMeta(); try { localStorage.removeItem(GH_CFG); localStorage.removeItem(GH_META); } catch (e) { } this.state = 'off'; },
  start() {
    this.stop();
    this.poll = setInterval(() => { if (document.visibilityState === 'visible') this.sync(); }, 15000); // only while the app is on screen; an unchanged check is one tiny request
  },
  stop() { clearInterval(this.poll); clearTimeout(this.timer); },
  boot() {
    this.load();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.sync(); else if (Object.keys(this.meta?.dirty || {}).length) this.sync(); });
    window.addEventListener('online', () => this.sync());
    window.addEventListener('offline', () => { if (this.on()) this.setState('offline'); });
    if (this.on()) { this.start(); this.sync(); }
  },
  card() {
    if (!this.on()) return `<section class="card"><div class="card-h"><h2>Sync</h2><span id="ghstat">${pill('', 'This browser')}</span></div>
      <p class="small dim">Connect your private GitHub repo to keep this phone and your browser in step. Data is saved to <span class="mono">orbit-data</span> as small JSON files, and also kept in this browser.</p>
      <div class="grid2 sec"><label class="fl">GitHub username<input class="in left" id="gh_o" value="${esc(ui.ghO ?? 'BigYellowBoi')}" autocapitalize="off" autocomplete="off" spellcheck="false"></label>
      <label class="fl">Data repo<input class="in left" id="gh_r" value="${esc(ui.ghR ?? 'orbit-data')}" autocapitalize="off" autocomplete="off" spellcheck="false"></label></div>
      <label class="fl">Access token<input class="in left" id="gh_t" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></label>
      <p class="xs muted">A fine-grained token with <b>Contents: read and write</b> on the data repo only. It stays in this browser and is sent only to GitHub.</p>
      <div class="btnrow"><button class="btn sm" data-act="ghconnect">Connect</button></div></section>`;
    return `<section class="card"><div class="card-h"><h2>Sync</h2><span id="ghstat">${this.pill()}</span></div>
      <p class="small dim">Saving to <span class="mono">${esc(this.cfg.owner)}/${esc(this.cfg.repo)}</span> and this device. Changes reach your other devices within seconds.</p>
      <p class="xs muted" id="ghat">${esc(this.atText())}</p><p class="small" id="gherr" style="color:var(--bad-ink)" ${this.state === 'error' ? '' : 'hidden'}>${esc(this.err || '')}</p>
      ${ui.confirm === 'ghoff' ? `<p class="small">Stop syncing on this device? Data here and in the repo stays as it is.</p><div class="btnrow"><button class="btn sm danger" data-act="ghoff">Disconnect</button><button class="link dim" data-act="confirm" data-v="">Cancel</button></div>`
      : `<div class="btnrow"><button class="btn sm ghost" data-act="ghnow">Sync now</button><button class="link dim" data-act="confirm" data-v="ghoff" style="margin-left:auto">Disconnect</button></div>`}</section>`;
  },
};
Object.assign(ACT, {
  ghconnect: async el => {
    const o = ($('#gh_o')?.value || '').trim(), r = ($('#gh_r')?.value || '').trim(), t = ($('#gh_t')?.value || '').trim();
    ui.ghO = o; ui.ghR = r;
    if (!o || !r || !t) { toast('Fill in all three fields', 'bad'); return; }
    el.disabled = true; el.textContent = 'Connecting…';
    try { await GH.connect(o, r, t); toast(GH.state === 'error' ? esc(GH.err) : 'Sync is on', GH.state === 'error' ? 'bad' : ''); }
    catch (e) { toast(esc(e.message), 'bad'); }
    render(true);
  },
  ghnow: () => GH.sync(),
  ghoff: () => { GH.disconnect(); ui.confirm = null; toast('Sync is off on this device'); render(true); },
});
/* AUTOMATIC SYNC: the sync helper (worker/) reports when it last reached WHOOP and last received Apple Health numbers
   at <helper>/status.json. The Data screen shows that, so a stalled helper is easy to spot. The address is kept in settings. */
/* Traffic from this phone, for the Data screen's Traffic card: per service, requests, time to the end of the body and bytes
   each way, plus GitHub's hourly allowance from its rate-limit headers. A browser can't time an upload on its own, so only
   download speed is worked out. */
const NET = { gh: { n: 0, n304: 0, ms: 0, up: 0, down: 0, last: null }, helper: { n: 0, n304: 0, ms: 0, up: 0, down: 0, last: null }, rate: null };
const nbytes = t => t ? new TextEncoder().encode(t).length : 0;
function netNote(svc, t0, up, down, r) {
  const x = NET[svc], ms = Math.max(1, Math.round(performance.now() - t0)); x.n++; if (r.status === 304) x.n304++;
  x.ms += ms; x.up += up; x.down += down; x.last = { ms, up, down, code: r.status, at: Date.now() };
  const left = r.headers.get('x-ratelimit-remaining'); if (svc === 'gh' && left != null) NET.rate = { left: +left, limit: +(r.headers.get('x-ratelimit-limit') || 5000), reset: +(r.headers.get('x-ratelimit-reset') || 0) * 1000 };
}
const Helper = {
  st: null, at: 0, err: null, busy: false,
  url() { return String(S().helper || '').trim().replace(/\/+$/, ''); },
  async refresh(force) {
    const u = this.url(); if (!u || this.busy || (!force && Date.now() - this.at < 60e3)) return;
    this.busy = true;
    try {
      const t0 = performance.now(), r = await fetch(u + '/status.json', { cache: 'no-store' }), txt = await r.text().catch(() => '');
      netNote('helper', t0, 0, nbytes(txt), r);
      if (r.status === 404) throw new Error('The helper needs updating: paste the latest orbit-sync.js into Cloudflare.');
      if (!r.ok) throw new Error('The sync helper answered with an error (' + r.status + ').');
      this.st = JSON.parse(txt); this.err = null;
    } catch (e) { this.err = e instanceof TypeError ? 'Couldn’t reach the sync helper. Check the address, or try again when you’re online.' : e.message; }
    this.busy = false; this.at = Date.now(); if (ui.tab === 'data') render();
  },
  when(t) {
    if (!t) return null;
    const d = new Date(t), day = todayStr(), ds = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`, clock = d.toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });
    const m = Math.round((Date.now() - t) / 60000), rel = m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 24 * 60 ? `${Math.round(m / 60)} h ago` : '';
    return `${ds === day ? '' : (ds === addDays(day, -1) ? 'yesterday' : fmtDate(ds)) + ' '}${clock}${rel ? ' · ' + rel : ''}`;
  },
  card() {
    const u = this.url();
    if (!u || ui.helperEdit) return `<section class="card"><div class="card-h"><h2>Automatic sync</h2><span class="eyebrow">sync helper</span></div>
      <p class="small dim">Add your sync helper's address to see when WHOOP and Apple Health last came in.</p>
      <label class="fl">Helper address<input class="in left" id="hl_u" value="${esc(u)}" placeholder="https://orbit-sync.yourname.workers.dev" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false"></label>
      <div class="btnrow"><button class="btn sm" data-act="helpersave">Save</button>${u ? '<button class="link dim" data-act="helpercancel">Cancel</button>' : ''}</div></section>`;
    this.refresh();
    const w = this.st?.whoop, h = this.st?.health, wAt = this.when(w?.checkedAt), hAt = this.when(h?.at);
    const wPill = !this.st ? pill('', this.err ? 'Unknown' : 'Checking…') : !w.connected ? pill('warn', 'Not connected') : w.error ? pill('bad', 'Problem') : !w.checkedAt || Date.now() - w.checkedAt > 75 * 60e3 ? pill('warn', 'Behind') : pill('good', 'Running');
    const hPill = !this.st ? '' : !h?.at ? pill('', 'Not set up') : Date.now() - h.at > 36 * 3600e3 ? pill('warn', 'Behind') : pill('good', 'Running');
    return `<section class="card"><div class="card-h"><h2>Automatic sync</h2><span class="eyebrow">sync helper</span></div>
      <ul class="rows"><li><span>WHOOP</span>${wPill}<span class="sub">${this.st ? (wAt ? `Last sync ${esc(wAt)}` : 'Not synced yet') : '&nbsp;'}${w && w.history && w.history !== 'complete' ? ` · history filling in, next ${esc(w.history)}` : ''}</span></li>
        <li><span>Apple Health</span>${hPill}<span class="sub">${this.st ? (hAt ? `Last received ${esc(hAt)}` : 'Nothing received yet') : '&nbsp;'}</span></li>
        ${(() => { const c = [[w?.dataAt, `${w?.dataWhat || 'WHOOP'}${w?.dataWhat ? ' from WHOOP' : ''}`], [h?.dataAt, 'Apple Health']].filter(x => x[0]).sort((a, b) => b[0] - a[0])[0]; return c ? `<li><span>Latest data</span><span class="sub">${esc(this.when(c[0]))} · ${esc(c[1])}</span></li>` : ''; })()}</ul>
      ${w?.error ? `<p class="small" style="color:var(--bad-ink)">${esc(w.error)}</p>` : ''}${this.err ? `<p class="small" style="color:var(--warn-ink)">${esc(this.err)}</p>` : ''}
      
      <div class="btnrow"><button class="link" data-act="helperrefresh">Refresh</button><button class="link dim" data-act="helperedit" style="margin-left:auto">Change address</button></div></section>`;
  },
  traffic() { // usage against limits, speeds per service, and the helper's recent sync log; refreshed in place every 2 s while open
    const st = this.st, u = st?.usage, net = st?.net || {}, kb = b => b == null ? '–' : b < 1024 ? `${b} B` : `${fmt(b / 1024, 1)} KB`;
    const short = n => n >= 1000 ? fmt(n / 1000, n % 1000 ? 1 : 0) + 'k' : String(n);
    const bar = (lab, used, lim, note) => `<li><span class="lab">${esc(lab)}</span><span class="trk"><span class="fill" style="width:${Math.min(100, used / lim * 100)}%;background:var(--${used / lim > .8 ? 'bad' : used / lim > .5 ? 'warn' : 's1'})"></span></span><span class="v">${short(used)} / ${short(lim)}</span></li>${note ? `<li class="hb-note"><span class="xs muted">${note}</span></li>` : ''}`;
    const speed = (down, ms) => down >= 2048 && ms > 0 ? `${fmt(down / 1024 / (ms / 1000), 0)} KB/s` : '–';
    const row = (name, x, scope) => !x || !x.n ? `<tr><td>${name}</td><td class="n muted" colspan="3">no requests yet</td></tr>`
      : `<tr><td>${name}<br><span class="xs muted">${scope}</span></td><td class="n">${fmt(x.ms / x.n, 0)} ms</td><td class="n">${speed(x.down, x.ms)}</td><td class="n">↓${kb(x.down)}<br><span class="xs muted">↑${kb(x.up)}</span></td></tr>`;
    const phoneGh = NET.gh, rate = NET.rate, reset = r => r?.reset ? new Date(r.reset).toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' }) : '';
    let h = `<section class="card" id="traffic"><div class="card-h"><h2>Traffic</h2><span class="eyebrow">live</span></div>`;
    h += `<span class="xs muted">Today, against the free limits</span><ul class="hbars use">`;
    if (u) h += bar('WHOOP calls', u.whoop, u.whoopLimit) + bar('Cloudflare writes', u.kv, u.kvLimit);
    if (u && u.ghLeft != null) h += bar('GitHub, helper', u.ghLimit - u.ghLeft, u.ghLimit, `resets ${esc(reset({ reset: u.ghReset }))}`);
    if (rate) h += bar('GitHub, phone', rate.limit - rate.left, rate.limit, `resets ${esc(reset(rate))}`);
    h += `</ul>${u ? `<span class="xs muted">${u.runs} checks, ${u.hooks} WHOOP notifications, ${u.health} Apple Health posts today.</span>` : ''}`;
    h += `<div class="tblwrap"><table class="tbl net"><thead><tr><th>Link</th><th class="n">Response</th><th class="n">↓ Speed</th><th class="n">Data</th></tr></thead><tbody>
      ${row('Phone → GitHub', phoneGh, `${phoneGh.n} request${phoneGh.n === 1 ? '' : 's'} this session${phoneGh.n304 ? `, ${phoneGh.n304} unchanged` : ''}`)}
      ${row('Phone → Helper', NET.helper, `${NET.helper.n} request${NET.helper.n === 1 ? '' : 's'} this session`)}
      ${row('Helper → WHOOP', net.whoop, net.whoop?.at ? `last run ${esc(new Date(net.whoop.at).toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' }))}` : '')}
      ${row('Helper → GitHub', net.gh, net.gh?.at ? `last run ${esc(new Date(net.gh.at).toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' }))}` : '')}
    </tbody></table></div><p class="xs muted">Response is the average per request. Speed shows for downloads over 2 KB.</p>`;
    // newest first; an entry a newer one supersedes is dropped (same rule as the helper's logEv)
    const lk = e => e.k === 'notify' ? 'notify:' + e.w : e.k === 'history' ? null : e.k, sup = (n, o) => { const k = lk(o); return k != null && (k === lk(n) || (n.k === 'full' && o.k === 'steps')); };
    const log = (st?.log || []).reduce((a, e) => (a.some(n => sup(n, e)) ? a : [...a, e]), []), lab = e => e.k === 'notify' ? `${e.w[0].toUpperCase() + e.w.slice(1)} (WHOOP notification)` : e.k === 'full' ? 'Full check' : e.k === 'steps' ? 'Steps and strain' : e.k === 'error' ? 'Problem' : e.w;
    if (log.length) h += `<span class="xs muted">Recent syncs by the helper</span><ul class="rows synclog">${log.slice(0, 12).map(e => `<li><span>${esc(lab(e))}</span>${e.k === 'error' ? pill('bad', 'Error') : e.ch ? pill('good', 'New data') : pill('', 'No change')}<span class="sub">${esc(this.when(e.t))}${e.rq ? ` · ${e.rq} request${e.rq === 1 ? '' : 's'}` : ''}${e.k === 'error' ? ' · ' + esc(e.w) : ''}</span></li>`).join('')}</ul>`;
    else if (st && !u) h += `<p class="xs muted">Paste the latest orbit-sync.js into Cloudflare to see the helper's usage and sync log.</p>`;
    return h + `</section>`;
  },
  explain() { // what arrives on its own, and what only comes from a file
    const hae = !!this.st?.health?.at;
    return `<section class="card"><div class="card-h"><h2>What syncs by itself</h2></div>
      <ul class="rows">
        <li><span><b>Automatic</b></span><span class="sub">WHOOP: everything, within a minute (steps and strain every 5 min).<br>Apple Health${hae ? '' : ' (once Health Auto Export is set up)'}: steps, food, weight, headphone level, hourly.<br>Your logs and settings: every device, as you go.</span></li>
        <li><span><b>Needs a file</b></span><span class="sub">MacroFactor's trend weight, expenditure and targets (.xlsx). Orbit estimates the first two until then.<br>Headphone listening time (full Health export).<br>WHOOP journal, e.g. alcohol (WHOOP export).</span></li>
      </ul></section>`;
  },
};
Object.assign(ACT, {
  helpersave: () => {
    let v = ($('#hl_u')?.value || '').trim().replace(/\/+$/, ''); if (v && !/^https?:\/\//i.test(v)) v = 'https://' + v;
    if (v && !/^https:\/\/[^\s/]+$/i.test(v)) { toast('Use just the address, like https://orbit-sync.yourname.workers.dev', 'bad'); return; }
    S().helper = v || null; ui.helperEdit = false; Helper.st = null; Helper.err = null; Helper.at = 0; saveSettings(); render(true);
  },
  helpercancel: () => { ui.helperEdit = false; render(true); },
  helperedit: () => { ui.helperEdit = true; render(true); },
  helperrefresh: () => { Helper.refresh(true); },
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && ui.tab === 'data') Helper.refresh(true); });
setInterval(() => { // Traffic is live while the Data screen is open: phone numbers every 2 s, the helper's every 15 s
  if (ui.tab !== 'data' || document.visibilityState !== 'visible') return;
  const el = $('#traffic'); if (el) keepAnchor(() => morphHTML(el, Helper.traffic())); // numbers change in place; nothing moves
  if (Date.now() - Helper.at > 15e3) Helper.refresh(true);
}, 2000);
GH.boot();
/* Update check: GitHub Pages and iOS can keep serving an older copy for a while. version.json is fetched past every cache;
   if it names a newer build, Today shows an Update ready button that reloads under a fresh URL. */
async function checkUpdate() {
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return;
    const j = await r.json(); if (j.v && newerVer(j.v, APP_VERSION) && ui.update !== j.v) { ui.update = j.v; renderUpdate(); render(); }
  } catch (e) { }
}
checkUpdate(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); }); setInterval(checkUpdate, 15 * 60 * 1000);
if (ui.tab === 'data') render(true);
